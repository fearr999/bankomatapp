name: Apply cardomats import to Railway

# Одноразовая задача: применяет scripts/out/import-cardomats.sql (72 точки
# картоматов MS0001-MS0075, уже геокодированные) к боевой Postgres-базе на
# Railway. Требует секрет репозитория RAILWAY_DATABASE_URL (строка
# подключения из Railway -> Postgres -> Connect). Запускается только вручную.
on:
  workflow_dispatch:
    inputs:
      organization_id:
        description: "id организации (оставьте пустым для автоопределения, если в базе только один банк-тенант верхнего уровня)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install psql
        run: sudo apt-get update -y && sudo apt-get install -y postgresql-client

      - name: Resolve organization id
        id: org
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          INPUT_ORG_ID: ${{ inputs.organization_id }}
        run: |
          if [ -n "$INPUT_ORG_ID" ]; then
            echo "id=$INPUT_ORG_ID" >> "$GITHUB_OUTPUT"
            echo "Использую переданный id организации: $INPUT_ORG_ID"
            exit 0
          fi
          COUNT=$(psql "$DATABASE_URL" -tAc 'SELECT count(*) FROM "Organization" WHERE "parentOrganizationId" IS NULL;')
          if [ "$COUNT" != "1" ]; then
            echo "::error::В базе $COUNT организаций верхнего уровня (не подрядчиков) — автоопределение невозможно. Список:"
            psql "$DATABASE_URL" -c 'SELECT id, name FROM "Organization" WHERE "parentOrganizationId" IS NULL ORDER BY "createdAt" ASC;'
            echo "Перезапустите workflow, указав organization_id вручную."
            exit 1
          fi
          ORG_ID=$(psql "$DATABASE_URL" -tAc 'SELECT id FROM "Organization" WHERE "parentOrganizationId" IS NULL LIMIT 1;')
          echo "id=$ORG_ID" >> "$GITHUB_OUTPUT"
          echo "Автоопределён id организации: $ORG_ID"

      - name: Apply import.sql
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
          ORG_ID: ${{ steps.org.outputs.id }}
        run: |
          sed "s/ORG_ID_HERE/$ORG_ID/g" scripts/out/import-cardomats.sql > /tmp/import-resolved.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /tmp/import-resolved.sql

      - name: Verify
        env:
          DATABASE_URL: ${{ secrets.RAILWAY_DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -c "SELECT count(*) AS cardomats_total FROM \"Equipment\" WHERE \"deviceType\" = 'cardomat';"
