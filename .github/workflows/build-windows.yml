name: Build Windows Desktop App

# Запускается автоматически при пуше в main/master и вручную из вкладки Actions.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Enable Windows desktop support
        run: flutter config --enable-windows-desktop

      # В репозитории лежат только lib/ и pubspec.yaml — без платформенной
      # папки windows/. Генерируем её прямо в проекте (не трогает lib/).
      - name: Scaffold windows platform folder
        run: flutter create --platforms=windows .

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        id: build
        env:
          # permission_handler_windows использует устаревший MSVC /await
          # (experimental coroutine), который последняя Visual Studio на
          # раннере считает ошибкой компиляции. Это глушит именно эту
          # проверку, не трогая код плагина.
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release --verbose *>&1 | Tee-Object -FilePath build_log.txt
        continue-on-error: true

      # Логи джобы недоступны через некоторые сетевые прокси/анализаторы —
      # публикуем их как release asset, который скачивается с обычного
      # github.com-домена, чтобы их можно было прочитать при падении сборки.
      - name: Publish log as release asset on failure
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "debug-log-${{ github.run_id }}" build_log.txt --title "Debug build log ${{ github.run_id }}" --notes "Automated Windows build failure log" --target "${{ github.sha }}"

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Zip the release build
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath merchandiser-app-windows.zip

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: merchandiser-app-windows
          path: merchandiser-app-windows.zip
