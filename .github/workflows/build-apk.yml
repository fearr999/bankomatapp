name: Build Android APK

# Запускается автоматически при пуше в main/master и вручную из вкладки Actions.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # В репозитории лежат только lib/ и pubspec.yaml — без платформенных папок
      # android/ и ios/. Генерируем их отдельным чистым Flutter-проектом,
      # чтобы использовать актуальные шаблоны Gradle с раннера, а не хранить
      # их вручную (это надёжнее и меньше ломается при обновлениях Flutter).
      - name: Scaffold platform folders
        run: |
          flutter create --platforms=android --org com.merchapp scaffold_tmp
          cp -r scaffold_tmp/android ./android
          rm -rf scaffold_tmp

      - name: Add required permissions to AndroidManifest.xml
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          python3 - "$MANIFEST" << 'PY'
          import sys
          path = sys.argv[1]
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()
          perms = (
              '    <uses-permission android:name="android.permission.CAMERA"/>\n'
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n'
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n'
              '    <uses-permission android:name="android.permission.INTERNET"/>\n'
          )
          if 'android.permission.CAMERA' not in content:
              content = content.replace('<application', perms + '\n    <application', 1)
              with open(path, 'w', encoding='utf-8') as f:
                  f.write(content)
              print('Permissions added.')
          else:
              print('Permissions already present, skipping.')
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (release, debug-signed)
        id: build
        run: flutter build apk --release --verbose 2>&1 | tee build_log.txt
        continue-on-error: true

      - name: Publish log as release asset on failure
        if: steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "debug-apk-log-${{ github.run_id }}" build_log.txt --title "Debug APK build log ${{ github.run_id }}" --notes "Automated Android build failure log" --target "${{ github.sha }}"

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: merchandiser-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
